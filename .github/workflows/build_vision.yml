# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Build visionOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "v.next" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Build visionOS
      run: xcodebuild -scheme arcgis-maps-sdk-swift-toolkit -destination 'platform=visionOS Simulator,OS=2.0,name=Apple Vision Pro'
