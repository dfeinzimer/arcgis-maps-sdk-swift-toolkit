# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "v.next" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: xcodebuild -scheme arcgis-maps-sdk-swift-toolkit -destination 'platform=iOS Simulator,OS=18.0,name=iPhone 16'
    # - name: Run tests
      # run: swift test -v
